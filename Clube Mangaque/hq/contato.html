<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clube Mangaquê</title>
    <link rel="stylesheet" href="styleContato.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>
<body>
    <header>
        <nav>
            <div class="nav-container">
                <div class="menu-image">
                    <img src="./images/mangaque.png" alt="logo">
                </div>
                <ul class="menu">
                    <li><a href="index.html">Início</a></li>
                    <li><a href="sobre.html">Sobre</a></li>
                    <li><a href="contato.html">Contato</a></li>
                    <li><a href="mangas.html">Mangás</a></li>
                    <li><a href="hqs.html">Hq's</a></li>
                    <li><a href="perfil.html"><i class="fas fa-user"></i> Perfil</a></li>

                </ul>

                <input type="text" class="search-box" placeholder="Buscar...">
            </div>
        </nav>
    </header>
    <main>
        <!--
        Fiz um formulário de contato sem necessitar de um BD por trás, visto que será utilizado apenas para teste
        Utilizei o FormSubmit para melhor praticidade
        -->
        <div >
            <h1 class="formCont">Formulário de Contato</h1>
            <!--Para uso de lembrança. caso o site for ao ar, retirar essa linha
                Email: sitemangaque@gmail.com
                Senha: Mangaque123!-->
                <form action="https://formsubmit.co/clubemangaque@gmail.com" method="POST" class="form">
                    
                    <label for="name">Nome</label>
                <input type="text" name="name" id="name" placeholder="Nome" required />

                <label for="email">Email</label>
                <Input type="email" name="email" id="email" placeholder="Email" required/>
                    
                    <label for="message">Mensagem</label>
                <textarea name="message" id="message" placeholder="Escreva sua mensagem"></textarea>
              <!-- o arquivo está retornando para o inicio do site--->
                <input type="hidden" name="_next" value="http://127.0.0.1:5500/TCC-DS/Clube%20Mangaque/hq/contato.html">
                    <button type="submit">Enviar</button>
               </form>
        </div>
    </main>

    <footer>
        <p style="margin-top: 100px;"> &copy; <span id="ano"></span> Clube Mangaquê. Todos os direitos reservados.</p>
    </footer>
    <script>
        document.getElementById("ano").textContent = new Date().getFullYear();
    </script>
     <script>
        document.querySelector(".search-box").addEventListener("keypress", function(e) {
            if (e.key === "Enter") {
                const termo = this.value.trim();
                if (termo !== "") {
                    window.location.href = "resultados.html?q=" + encodeURIComponent(termo);
                }
            }
        });
    </script>
    
</body>
</html>
