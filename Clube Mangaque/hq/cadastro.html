<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clube Mangaquê</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <div class="nav-container">
                <div class="menu-image">
                    <img src="./images/mangaque.png" alt="logo">
                </div>             
            </div>
        </nav>
    </header>

    <div>
        <button class="btn_voltar">Voltar</button>
    </div>

    <main>
        <div class="cadastro-container">
            <div class="card-cadastro">
                <h1>Cadastre-se</h1>
                <form>
                    <div class="textfield">
                        <label for="nome">Nome Completo</label>
                        <input type="text" id="nome" name="nome" placeholder="Digite seu nome e sobrenome">
                    </div>
                    <div class="textfield">
                        <label for="apelido">Apelido/Nome Social</label>
                        <input type="text" id="apelido" name="apelido" placeholder="Como deseja ser chamado?">
                    </div>
                    <div class="textfield">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" name="email" placeholder="Digite seu e-mail">
                    </div>
                    <div class="textfield">
                        <label for="senha">Senha</label>
                        <input type="password" id="senha" name="senha" placeholder="Senha">
                    </div>
                    <div class="textfield">
                        <label for="confirmar-senha">Confirmar Senha</label>
                        <input type="password" id="confirmar-senha" name="confirmar-senha" placeholder="Confirme sua senha">
                    </div>

                    <button type="submit" class="btn-cadastrar">Cadastrar</button>
                </form>
            </div>
        </div>
    </main>

    <footer>
        <p>© 2024 Clube Mangaquê</p>
    </footer>
</body>
</html>
