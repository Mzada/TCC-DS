<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clube Mangaquê</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <div class="nav-container">
                <div class="menu-image">
                    <img src="./images/mangaque.png" alt="logo">
                </div>             
            </div>
        </nav>
    </header>
    <div>
        <button class="btn_voltar">Voltar</button>
    </div>
    <main class="main-cadastro">
        <div class="cadastro-container">
            <div class="card-cadastro">
                <h1>Cadastre-se</h1>
                    <form class="formCadastro" action="processaCadastro.php" method="POST">
                    
                    <div class="textfield">
                        <label for="nome">Nome Completo</label>
                        <input type="text" name="nomeCompleto" placeholder="Digite seu nome e sobrenome" required>
                    </div>
                    <div class="textfield">
                        <label for="apelido">Apelido/Nome Social</label>
                        <input type="text" name="apelido" placeholder="Como deseja ser chamado?">
                    </div>
                    <div class="textfield">
                        <label for="email">E-mail</label>
                        <input type="text" name="email" placeholder="Digite seu e-mail" required>
                    </div>
                    <div class="textfield">
                        <label for="dataNascimento">Data de Nascimento</label>
                        <input type="date" name="dataNascimento" required>
                    </div>
                    <div class="textfield">
                        <label for="senha">Senha</label>
                        <input type="password" name="senha" placeholder="Senha" required>
                    </div>
                    <div class="textfield">
                        <label for="confirmarSenha">Confirmar Senha</label>
                        <input type="password" name="confirmarSenha" placeholder="Confirme sua senha" required>
                    </div>
                    <button type="submit" class="btn-cadastrar">Cadastrar</button>
                </form>
            </div>
        </div>
    </main>

    <footer>
        <p> &copy; <span id="ano"></span> Clube Mangaquê. Todos os direitos reservados.</p>
    </footer>

    <!--Atualiza o ano automaticamente-->
    <script>
        document.getElementById("ano").textContent = new Date().getFullYear();
    </script>

    <!--Apresentação das mensagens de erro-->
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const erro = urlParams.get('erro');
        const sucesso = urlParams.get('sucesso');

        if(erro == 'idade'){
            alert('Você deve ter pelo menos 16 anos para se cadastrar!');
        }else if(erro == 'senhas'){
            alert('As senhas não coincidem!');
        }else if(erro == 'email'){
            alert('Este e-mail já  está cadastrado.');
        }else if(erro == 'bd'){
            alert('Erro ao cadastrar. Tente novamente mais tarde');
        }else if(sucesso == '1'){
            alert('Cadastro realizado com sucesso!');
        }
    </script>
</body>
</html>
