        <div class="nav-container">

<main>
    <section class="perfil-info">
        <div class="perfil-header">
            <label for="foto">
                <img src="" alt="Foto de Perfil" class="foto-perfil">
            </label>
            <div class="dados-usuario">
                <h2 id="apelidoDisplay"></h2>
                <br>
                <p id="emailDisplay"></p>
                <br>
                <button class="btn-editar-perfil">Editar Perfil</button>
            </div>
        </div>
        <form action="atualizarPerfil.php" method="POST" enctype="multipart/form-data" class="form-editar" style="display: none;">
            <input type="file" id="foto" name="fotoPerfil" accept="image/*">
            <label for="nome_completo">Nome Completo</label>
            <input type="text" id="nome_completo" name="nome_completo" placeholder="Digite seu nome e sobrenome" required>
            <label for="apelidoEditar">Apelido/Nome Social</label>
            <input type="text" id="apelidoEditar" name="apelido" placeholder="Como deseja ser chamado?" required>
            <label for="emailEditar">E-mail</label>
            <input type="text" id="emailEditar" name="email" placeholder="Digite seu e-mail" required>
            <button type="submit" class="btn-salvar">Salvar</button>
        </form>
    </section>
    
    <section class="lista-mangas">
        <h2>Minhas avaliações</h2>

            <thead>

                    <th></th>

                    <th>Comentário</th>

</main>

<!--Script que atualiza o ano automaticamente-->
<script>
    document.getElementById("ano").textContent = new Date().getFullYear();
    document.querySelector('.btn-editar-perfil').addEventListener('click', function() {
        document.querySelector('.form-editar').style.display = 'block';
    });
</script>
<script>
    document.querySelector(".search-box").addEventListener("keypress", function(e) {
        if (e.key === "Enter") {
            const termo = this.value.trim();
            if (termo !== "") {
                window.location.href = "resultados.html?q=" + encodeURIComponent(termo);
            }
        }
    });
</script>

<!--Script que puxa o nome e email-->
<script>
    fetch('getUsuario.php')
      .then(res => res.json())
      .then(data => {

        //Dados Display
            document.getElementById('apelidoDisplay').textContent = data.apelido;
            document.getElementById('emailDisplay').textContent = data.email;

            //Atualiza a foto do perfil
            const imgPerfil = document.querySelector('.foto-perfil');
            if (data.fotoPerfil && data.fotoPerfil !== "") {
                imgPerfil.src = data.fotoPerfil;
            } else {
                imgPerfil.src = "./img/perfis/avatar.jpg"; // fallback
            }

            //Dados carregados somente na ação do botão
            document.querySelector(".btn-editar-perfil").addEventListener("click", function() {

            document.querySelector(".form-editar").style.display = "block";
            

            //Puxa os dados para o Formulario de Edição
            document.getElementById('nome_completo').value = data.nome_completo;
            document.getElementById('apelidoEditar').value = data.apelido;
            document.getElementById('emailEditar').value = data.email;
            
            
            });

        })
        .catch(err => console.error('Erro:', err));
</script>

<!--Script mensagens de Atualização de perfil-->
<script>
    const urlParams = new URLSearchParams(window.location.search);
    const erro = urlParams.get('erro');
    const sucesso = urlParams.get('sucesso');

    if(erro == 'bd'){
        alert('Erro ao atualizar o perfil. Tente novamente mais tarde.');
    }else if(sucesso == '1'){
        alert('Cadastro atualizado com sucesso!');
    }
</script>
<!--Script mensagens de Atualização de perfil-->

<!--Script puxar as avaliações-->
<script>
    fetch('getAvaliacoes.php')
        .then(res => res.json())
        .then(data => {
            console.log("Dados recebidos:", data.avaliacoes);

            const tbody = document.querySelector(".tabela-mangas tbody");
            if (!tbody) {
                console.error("Erro: Elemento tbody não encontrado!");
                return;
            }

            tbody.innerHTML = '';

            if (data.avaliacoes.length === 0) {
                console.log(`Carregadas ${data.avaliacoes.length} avaliações`);
                tbody.innerHTML = '<tr><td colspan="7">Nenhuma avaliação encontrada.</td></tr>';
                return;
            }

            data.avaliacoes.forEach(avaliacao => {
                console.log("Adicionando à tabela:", avaliacao);
                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td><img src="${avaliacao.capa}" alt="Capa de ${avaliacao.nome}" class="capa-manga"></td>
                    <td>${avaliacao.titulo}</td>
                    <td>${avaliacao.ano_publicacao}</td>
                    <td>${avaliacao.autor}</td>
                    <td>${avaliacao.comentario}</td>
                    <td>${avaliacao.nota}/5⭐</td>
                    <td>
                        <div class="btns-acao">
                            <button class="btn-editar">Editar</button>
                            <button class="btn-excluir">Excluir</button>
                        </div>
                    </td>
                `;

                //Evento dos botões
                tr.querySelector(".btn-editar").addEventListener("click", () => editarLinha(tr, avaliacao));
                tr.querySelector(".btn-excluir").addEventListener("click", () => excluirAvaliacao(avaliacao.idavaliacao));

                tbody.appendChild(tr);
            });
        })
        .catch(erro => console.error("Erro ao carregar avaliações:", erro));

        //Função de editar avaliação
        function editarLinha(tr, avaliacao){
            tr.innerHTML = `
                <td><img src="${avaliacao.capa}" alt="Capa de ${avaliacao.nome}" class="capa-manga"></td>
                <td>${avaliacao.titulo}</td>
                <td>${avaliacao.ano_publicacao}</td>
                <td>${avaliacao.autor}</td>
                <td><textarea name="comentarioEditar" row="3">${avaliacao.comentario || ''}</textarea></td>
                <td>
                    <select name="notaEditar">
                        ${[1, 2, 3, 4, 5].map(n => `<option value="${n}" ${n==avaliacao.nota ? 'selected' : ''}>${n}</option>`).join('')}
                    </select>/5⭐
                </td>
                <td>
                    <div class="btns-editar">
                        <button class="btn-salvarE" onclick="salvarEdicao(${avaliacao.idavaliacao}, this)">Salvar</button>
                        <button class="btn-cancelarE" onclick="cancelarEdicao()">Cancelar</button>
                    </div>    
                </td>
            `;
        }

        //Função Salvar edição
        function salvarEdicao(idavaliacao, btn){
            const tr = btn.closest("tr");
            const comentario = tr.querySelector('textarea[name="comentarioEditar"]').value;
            const nota = tr.querySelector('select[name="notaEditar"]').value;

            fetch("editarAvaliacao.php", {
                method: "POST",
                headers: {"Content-Type":"application/json"},
                body: JSON.stringify({idavaliacao, comentarioEditar: comentario, notaEditar: nota})
            })
            .then(res=>res.json())
            .then(res=>{
                if(res.sucesso){
                    alert("Avaliação atualizada!");
                    location.reload();
                }else{
                    alert("Erro ao atualizar.");
                }
            });
        }

        //Função cancelar edição
        function cancelarEdicao(){
            location.reload();
        }
        
        //Função excluir avaliação
        function excluirAvaliacao(idavaliacao){
            if(!confirm("Tem certeza que deseja excluir esta avaliação?")) return;
            
            fetch("excluirAvaliacao.php", {
                method:"POST",
                headers: {"Content-Type":"application/json"},
                body: JSON.stringify({idavaliacao})
            })
            .then(res=>res.json())
            .then(res=>{
                if(res.sucesso){
                    alert("Avaliação excluída.")
                    location.reload();
                }else{
                    alert("Erro ao excluir.")
                }
            });
        }
</script>
<!--Script puxa as avaliações-->
